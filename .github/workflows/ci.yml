name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded run on the same branch is wasted CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheel only — the default Linux torch wheel drags in ~800MB of
          # CUDA we never use (Section 12: "CPU wheel sufficient").
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        # No dataset needed: every test runs against fixtures and tmp dirs, so
        # CI stays seconds rather than downloading the 445MB archive. The
        # submission round trip does need the data — see submission-check.yml.
        run: pytest -q

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Run pre-commit hooks
        # Secrets in git history are an unrecoverable scored failure
        # (Section 9.1), so this gate runs on every PR, not just locally.
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
