[project]
name = "techjam-recsys-agent"
version = "0.1.0"
description = "Autonomous ML research agent for recommender systems — TechJam 2026, Track 2"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Torch 2.2's macOS Intel build predates NumPy 2's array ABI.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pandas",
    "polars",
    "lightgbm",
    # PyTorch stopped publishing macOS Intel wheels after 2.2.2. Keep that
    # supported release on x86_64 Macs and use the current resolver elsewhere.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "optuna",
    "anthropic",
    "python-dotenv",
    "pydantic>=2",
    "rich",
    "jinja2",
    "matplotlib",
]

# Mirrored intentionally: uv reads [dependency-groups] (PEP 735), while
# `pip install -e ".[dev]"` needs [project.optional-dependencies]. Keep the
# two lists in sync.
[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.5", "pre-commit", "detect-secrets"]

[dependency-groups]
dev = ["pytest", "ruff==0.16.5", "pre-commit", "detect-secrets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Never linted, never formatted: these are the organiser's files. evaluate.py
# and submit.py are the scoring ground truth and are hashed into every run
# manifest (Section 8.3) — a lint autofix would break preflight.
extend-exclude = [
    "kuairand-starter-kit",
    "pipeline/evaluate.py",
    "pipeline/submit.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "agent", "tools"]
